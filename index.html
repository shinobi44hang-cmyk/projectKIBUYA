<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Portfolio</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  
  <link href="assets/css/bootstrap-icons.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>

<body>

  <main>
    
    <section id="hero" class="hero">
      <div class="hero-fixed-container">
        
        
        <div class="hero-text">
          <h1 class="hero-title">
            Creative <span class="accent">Designer</span>
          </h1>
          <p class="hero-description">
            I create digital experiences that inspire and engage. With a passion for clean design and innovative solutions, I transform ideas into beautiful, functional realities.
          </p>

          <!-- Stats -->
          <div class="hero-stats">
            <div class="stat-item">
              <span class="stat-num">150+</span>
              <span class="stat-label">Projects</span>
            </div>
            <div class="stat-item">
              <span class="stat-num">5+</span>
              <span class="stat-label">Years Exp.</span>
            </div>
            <div class="stat-item">
              <span class="stat-num">98%</span>
              <span class="stat-label">Happy Clients</span>
            </div>
          </div>

         
          <div class="hero-btns">
            <a href="#portfolio" class="btn btn-primary">View My Work</a>
            <a href="#contact" class="btn btn-outline">Get In Touch</a>
          </div>

        
          <div class="hero-socials">
            <a href="#"><i class="bi bi-twitter-x"></i></a>
            <a href="#"><i class="bi bi-linkedin"></i></a>
            <a href="#"><i class="bi bi-github"></i></a>
            <a href="#"><i class="bi bi-instagram"></i></a>
          </div>
        </div>


        <div class="hero-visual">
          <div class="image-stack">
            

            <div class="info-card card-ux">
              <i class="bi bi-palette"></i> <span>UI/UX Design</span>
            </div>
            <div class="info-card card-dev">
              <i class="bi bi-code-slash"></i> <span>Development</span>
            </div>
            <div class="info-card card-idea">
              <i class="bi bi-lightning"></i> <span>Creative Ideas</span>
            </div>

            <img src="assets/img/profile/profile-square-1.webp" alt="Portfolio Image" class="hero-main-img">
            <div class="img-decorative-bg"></div>
          </div>
        </div>

      </div>
    </section>
  </main>

</body>
</html>
